<style>
:root{--bg:#f4f0ea;--card:#fbf9f6;--ink:#2a2622;--muted:#6d655c;--line:#e3ddd3;--accent:#8a6a43;--accent-d:#6f5232;--tint:#ece6dc;--font:"Inter","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:#e8e4db;color:#2a2622;font:400 16px/1.5 "Inter","Helvetica Neue",Arial,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px}
#stage{display:grid;justify-items:center;gap:12px}
#device{position:relative;width:375px;height:812px;background:#f4f0ea;border-radius:44px;overflow:hidden;box-shadow:0 0 0 10px #1c1c1e,0 30px 60px rgba(40,30,20,.35);display:flex;flex-direction:column;isolation:isolate}
#device,#device *{-webkit-user-select:none;user-select:none}
#device input,#device select{-webkit-user-select:text;user-select:text}
#statusbar{height:44px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 28px 0 32px;font:600 15px "Inter",sans-serif;color:#2a2622;background:#f4f0ea;z-index:40}
#statusbar svg{height:12px;fill:currentColor}
#scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 16px 28px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#scroll::-webkit-scrollbar{display:none}
.cap{max-width:375px;text-align:center;color:#6d655c;font-size:13px;margin:0}
.cap b{color:#2a2622}
@media(max-width:520px){body{padding:0;display:block;background:#f4f0ea}#stage{display:block;height:100vh;height:100dvh}#device{width:100%;height:100%;border-radius:0;box-shadow:none}#statusbar{display:none}.cap{display:none}}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid #8a6a43;outline-offset:2px;border-radius:10px}
.wrap{margin:0}
header.top{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;height:64px;border-bottom:1px solid var(--line);position:relative}
.brand{font:italic 800 26px/1 var(--font);letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.menu-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;margin-right:-8px}
.menu-btn span,.menu-btn span:before,.menu-btn span:after{display:block;width:20px;height:2px;background:#2a2622;border-radius:2px;position:relative;content:"";transition:.2s}
.menu-btn span:before{position:absolute;top:-6px}.menu-btn span:after{position:absolute;top:6px}
.menu-btn[aria-expanded=true] span{background:transparent}
.menu-btn[aria-expanded=true] span:before{top:0;transform:rotate(45deg)}
.menu-btn[aria-expanded=true] span:after{top:0;transform:rotate(-45deg)}
nav.drop{position:absolute;left:0;right:0;top:108px;bottom:0;background:rgba(244,240,234,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;z-index:20;padding:20px}
.top{z-index:30;background:#f4f0ea}
nav.drop[hidden]{display:none}
nav.drop a{padding:12px 24px;color:#8c857b;text-decoration:none;font:600 24px/1.2 "Inter",sans-serif;letter-spacing:.06em}
nav.drop a:hover{color:#2a2622}nav.drop a[aria-current=page]{color:#2a2622}
nav.drop small{color:#6d655c;font-weight:500}
h1.page{font:700 22px/1.2 var(--font);letter-spacing:.12em;text-transform:uppercase;text-align:center;margin:28px 0 20px}
.hero{text-align:center;padding:26px 0 8px}
.hero h1{font:italic 800 40px/1.1 var(--font);letter-spacing:-.02em;margin:0 0 8px}
.hero p{margin:0;color:#6d655c;font-size:17px}
.tiles{display:grid;gap:16px;margin-top:20px}

.tile{display:block;text-align:center;background:#fbf9f6;border:1px solid var(--line);border-radius:20px;padding:12px 12px 20px;text-decoration:none;color:#2a2622;transition:transform .2s,box-shadow .2s}
.tile:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(42,38,34,.1)}
.tile img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;display:block}
.tile h2{font:700 22px/1.2 var(--font);letter-spacing:.08em;margin:16px 0 6px}
.tile p{margin:0;color:#6d655c;font-size:15px}
.items{display:grid;gap:12px;list-style:none;padding:0;margin:0}
.item{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:#fbf9f6;border:1px solid var(--line);border-radius:18px;padding:14px;transition:transform .2s,box-shadow .2s}
.item:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(42,38,34,.08)}
.item .tx{flex:1;min-width:0}
.item .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.item h3{margin:0;font:600 17px/1.25 var(--font)}
.price{font:700 17px var(--font);white-space:nowrap}
.item p{margin:6px 0 0;color:#6d655c;font-size:15px;line-height:1.45}
.item img{width:76px;height:64px;object-fit:cover;border-radius:12px;flex:none}
.saved-dot{color:#8a6a43;font-size:14px;margin-left:6px}
.bar{position:sticky;bottom:12px;margin-top:20px;display:flex;justify-content:space-between;align-items:center;gap:12px;background:#2a2622;color:#f4f0ea;border-radius:16px;padding:12px 14px 12px 18px;box-shadow:0 14px 30px rgba(42,38,34,.25)}
.bar[hidden]{display:none}
.bar b{font-weight:600}
.btn{display:inline-block;background:#8a6a43;color:#fff;font-weight:600;padding:12px 20px;border-radius:12px;text-decoration:none;text-align:center}
.btn:hover{background:#6f5232}
.btn.ghost{background:transparent;color:#2a2622;border:1px solid #cfc7ba}
.btn.light{background:#f4f0ea;color:#2a2622;padding:9px 14px}
.panel{background:#fbf9f6;border:1px solid var(--line);border-radius:20px;padding:24px;text-align:center}
.panel h2{font:600 20px/1.3 var(--font);margin:0 0 10px}
.panel p{margin:0 0 14px;color:#6d655c}
.panel hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.policy{background:#ece6dc;border-radius:16px;padding:18px 20px;text-align:left;margin-top:18px}
.policy h3{margin:0 0 8px;text-align:center;font:600 16px var(--font)}
.policy ul{margin:0;padding-left:18px;color:#6d655c;font-size:14.5px;line-height:1.7}
form.req{display:grid;gap:12px;text-align:left;margin-top:6px}
form.req label{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#6d655c;display:grid;gap:6px}
form.req input,form.req select{font:inherit;font-size:16px;padding:12px;border:1px solid #cfc7ba;border-radius:12px;background:#fff;color:#2a2622;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hrs{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:14px;color:#6d655c;border-top:1px solid var(--line);text-align:left}
.hrs:first-of-type{border-top:0}
.note{font-size:14px;color:#6d655c;margin:0}
.note.warn{color:#8a4a2a}
.ok{background:#e7efe3;border:1px solid #c5d6be;border-radius:16px;padding:18px;text-align:left;color:#2f4a2a}
.ok h3{margin:0 0 6px;font:600 18px var(--font)}
.ok p{margin:0;color:#3d5a37}
.sheet-bg{position:absolute;inset:0;background:rgba(30,25,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{background:#fbf9f6;width:100%;border-radius:24px 24px 0 0;padding:16px 20px 28px;transform:translateY(30px);transition:transform .25s;max-height:92vh;overflow:auto}
.sheet-bg.on .sheet{transform:none}

.sheet .grab{width:44px;height:4px;border-radius:4px;background:#d8d0c4;margin:0 auto 14px}
.sheet img{width:104px;height:88px;object-fit:cover;border-radius:14px;display:block;float:right;margin:2px 0 8px 14px}
.sheet h2{font:700 24px/1.2 var(--font);margin:6px 0 4px}
.sheet .meta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.sheet p{margin:0 0 12px;color:#6d655c}
.sheet .acts{clear:both;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.sheet .acts button{padding:13px;border-radius:12px;font-weight:600;border:1px solid #cfc7ba}
.sheet .acts button.on{background:#8a6a43;color:#fff;border-color:#8a6a43}
.sheet .acts .close{background:#2a2622;color:#f4f0ea;border-color:#2a2622}
.foot{text-align:center;color:#6d655c;font-size:13px;margin-top:34px}
.foot b{color:#2a2622}
.empty{color:#6d655c;text-align:center;padding:18px}
.sheet ul.list{list-style:none;margin:8px 0 12px;padding:0}
.sheet ul.list li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0 0 16px}
.chip{border:1px solid #cfc7ba;border-radius:999px;padding:7px 14px;font:600 13px "Inter",sans-serif;color:#6d655c;background:transparent}
.chip[aria-pressed=true]{background:#2a2622;color:#f4f0ea;border-color:#2a2622}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font:700 11px "Inter",sans-serif;letter-spacing:.06em;border-radius:6px;padding:3px 7px;background:#ece6dc;color:#6f5232}
.tag.pick{background:#8a6a43;color:#fff}
.open{display:inline-flex;align-items:center;gap:8px;font:600 13px "Inter",sans-serif;color:#6d655c;margin-top:14px}
.open i{width:8px;height:8px;border-radius:50%;background:#b9b0a3;display:inline-block}
.open.on i{background:#4f9a5b}
.fine{font-size:12.5px;line-height:1.5;color:#6d655c;text-align:center;margin:22px 4px 6px}
.sheet .kv{font-size:14px;color:#6d655c;margin:0 0 8px;clear:both}
.sheet .kv b{color:#2a2622}
.sheet .pairbtn{font:600 14px "Inter",sans-serif;color:#6f5232;text-decoration:underline;background:none;border:0;padding:0}
.sheet .note{font-style:italic;color:#2a2622;margin:0 0 10px}
</style>

function openNow(){
  var p=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",weekday:"short",hour:"numeric",hour12:false}).formatToParts(new Date());
  var wd=p.filter(function(x){return x.type==="weekday"})[0].value,hr=parseInt(p.filter(function(x){return x.type==="hour"})[0].value,10)%24;
  var wk=["Sat","Sun"].indexOf(wd)<0,close=wk?22:24,label=wk?"10 PM":"midnight";
  if(hr>=13&&hr<close)return{on:1,text:"Open now · until "+label};
  return{on:0,text:"Closed now · opens at 1 PM"};
}

var FILT={};

  var cw=el("div","chips");
  [["all","All"],["V","Vegetarian"],["GF","Gluten-free"]].forEach(function(c){
    if(c[0]==="V"&&!hasV)return;if(c[0]==="GF"&&!hasG)return;
    var b=el("button","chip",c[1]);b.type="button";b.setAttribute("aria-pressed",f===c[0]?"true":"false");
    b.addEventListener("click",function(){FILT[kind]=c[0];render()});cw.appendChild(b)});
  if(cw.children.length>1)view.appendChild(cw);
  var ul=el("ul","items");
  list.filter(function(d){return f==="all"||tagsOf(d).indexOf(f)>-1}).forEach(function(d){
    var li=el("li");var b=el("button","item");b.type="button";

    var bt=el("button","btn light","View");bt.type="button";bt.addEventListener("click",openSaved);bar.appendChild(bt);view.appendChild(bar)}
}

function reservation(){
  view.appendChild(el("h1","page","Reservation"));
  var p=el("div","panel");
  p.appendChild(el("h2",null,"Make a Reservation"));
  p.appendChild(el("p",null,"We invite you to enjoy an exceptional dining experience at Zenith. To ensure you have the best table, please make a reservation in advance."));
  var box=el("div");

    box.textContent="";
    var f=el("form","req");f.noValidate=true;
    f.innerHTML='<div class="two"><label>Date<input type="date" id="rd" required></label><label>Time<select id="rt"><option>5:30 PM</option><option>6:00 PM</option><option selected>7:00 PM</option><option>7:30 PM</option><option>8:30 PM</option><option>9:00 PM</option></select></label></div><div class="two"><label>Guests<select id="rg"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></label><label>Name<input type="text" id="rn" placeholder="Your name" autocomplete="off"></label></div><p class="note" id="rnote" aria-live="polite"></p><button class="btn" type="submit">Request this table</button>';
    var d=new Date();d.setDate(d.getDate()+1);var iso=d.toISOString().slice(0,10);
    box.appendChild(f);var rd=f.querySelector("#rd");rd.value=iso;rd.min=new Date().toISOString().slice(0,10);
    var g=f.querySelector("#rg"),note=f.querySelector("#rnote");
    function upd(){var big=parseInt(g.value,10)>=6;note.className="note"+(big?" warn":"");note.textContent=big?"Large parties (6+) may require a deposit. For special events please call (917) 000-0011.":""}
    g.addEventListener("change",upd);upd();
    f.addEventListener("submit",function(e){e.preventDefault();
      var nm=f.querySelector("#rn").value.trim();
      if(!nm){note.className="note warn";note.textContent="Please add a name for the table.";f.querySelector("#rn").focus();return}
      var dt=new Date(rd.value+"T12:00:00");var ds=isNaN(dt)?rd.value:dt.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
      box.textContent="";var ok=el("div","ok");ok.setAttribute("role","status");
      ok.appendChild(el("h3",null,"Table requested, "+nm));
      ok.appendChild(el("p",null,ds+" at "+f.querySelector("#rt").value+" for "+g.value+(g.value==="1"?" guest":" guests")+". This is a prototype, so nothing was actually sent. In the real design, guests book through Resy."));
      box.appendChild(ok);var again=el("button","btn ghost","Change request");again.type="button";again.style.cssText="margin-top:12px;width:100%";again.addEventListener("click",form);box.appendChild(again)});
  }
  p.appendChild(el("hr"));
  var rs=el("p");rs.innerHTML="<b style='color:#2a2622'>Reserve now through Resy:</b><br>https://resy.com/zenith-reservations";p.appendChild(rs);
  var sp=el("p");sp.innerHTML="<b style='color:#2a2622'>For special events or large parties:</b><br>Please call us directly at (917) 000-0011";p.appendChild(sp);
  var pol=el("div","policy");pol.appendChild(el("h3",null,"Reservation Policy"));var ul=el("ul");
  ["Reservations recommended for dinner service","Tables held for 15 minutes past reservation time","Cancellations appreciated with 2+ hours notice","Large parties (6+) may require deposit"].forEach(function(x){ul.appendChild(el("li",null,x))});
  pol.appendChild(ul);p.appendChild(pol);view.appendChild(p);
  var q=el("div","panel");q.style.marginTop="16px";q.appendChild(el("h2",null,"Request a table (prototype)"));q.appendChild(box);view.appendChild(q);form();

function openDish(d,after){

    if(x.pick||(x.t&&x.t.length)){var tg=el("div","tags");tg.style.cssText="margin:0 0 10px;clear:both";if(x.pick)tg.appendChild(el("span","tag pick","CHEF'S PICK"));(x.t||[]).forEach(function(t){tg.appendChild(el("span","tag",t==="V"?"VEGETARIAN":"GLUTEN-FREE"))});s.appendChild(tg)}
