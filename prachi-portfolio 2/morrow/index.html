<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Morrow Card Wallet | Concept prototype</title><meta name="description" content="Interactive card wallet concept: made-up brand, sample numbers. Press a card, flip it, change the finish, drag up to pay."><meta property="og:title" content="Morrow Card Wallet | Concept prototype"><meta property="og:description" content="Interactive card wallet concept: made-up brand, sample numbers. Press a card, flip it, change the finish, drag up to pay."><meta property="og:type" content="website"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%231B3358'/%3E%3Cpath d='M7 19a9 9 0 0 1 18 0' fill='none' stroke='white' stroke-width='3.6' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='10.5' r='2.7' fill='%23FF6B4A'/%3E%3C/svg%3E"><style>:root{color-scheme:light}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* One committed look: warm paper stage, ink wallet, four saturated cards built to real card proportions (85.6 x 53.98 mm). Single theme by design. */
:root{
  --paper:#F3EEE6; --ink:#121212; --muted:#6F6A62; --line:#DDD6CA;
  --c1:#3347FF; --c2:#FF6B4A; --c3:#14A883; --c4:#F2C94C;
  --display:"Space Grotesk","Helvetica Neue",Arial,sans-serif; --body:"Inter","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper); color:var(--ink); font-family:var(--body); margin:0; padding-block:24px;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center}
main{width:100%; display:flex; flex-direction:column; align-items:center; gap:14px}
.stage{position:relative; width:100%; max-width:380px; height:680px; border-radius:44px; background:#FBF8F3; border:1px solid var(--line);
  overflow:hidden; box-shadow:0 30px 60px -30px rgba(40,30,10,.35); touch-action:manipulation; user-select:none; -webkit-user-select:none}
.top{position:absolute; inset:28px 28px auto 28px; display:flex; align-items:center; justify-content:space-between}
.logo{display:flex; align-items:center; gap:10px; font-family:var(--display); font-weight:700; font-size:22px; letter-spacing:-.02em}
.hint{font-size:12px; color:var(--muted); font-weight:500}
.bal{position:absolute; left:28px; right:28px; top:84px}
.bal small{display:block; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600}
.bal strong{display:block; font-family:var(--display); font-size:40px; letter-spacing:-.03em; line-height:1.1; margin-top:4px; font-variant-numeric:tabular-nums}
.actions{position:absolute; left:28px; right:28px; top:148px; display:flex; justify-content:space-between; gap:8px; opacity:0; pointer-events:none; transition:opacity .25s; z-index:30}
.actions.on{opacity:1; pointer-events:auto}
.pill{font:inherit; font-size:13px; font-weight:600; padding:8px 14px; border-radius:999px; border:1px solid var(--ink); background:transparent; color:var(--ink); cursor:pointer}
.pill.fill{background:var(--ink); color:#fff}
.pill[disabled]{opacity:.4; cursor:default}
.pill:focus-visible,.seg button:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
.back-w{position:absolute; left:24px; right:24px; top:384px; bottom:40px; background:#0b0b0b; border-radius:30px 30px 34px 34px; z-index:0}
.front-w{position:absolute; left:24px; right:24px; top:400px; bottom:40px; z-index:20; pointer-events:none;
  background:linear-gradient(180deg,#232323 0,#161616 40%,#0e0e0e 100%); border-radius:30px 30px 34px 34px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.12), 0 -10px 24px -12px rgba(0,0,0,.35)}
.front-w::before{content:""; position:absolute; left:50%; top:20px; width:56px; height:6px; border-radius:6px; background:#3a3a3a; transform:translateX(-50%)}

/* Controls living on the wallet front: finish switch and recent activity */
.fin{position:absolute; left:46px; right:46px; top:438px; z-index:25; display:flex; align-items:center; justify-content:space-between; color:#8d8a84; font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase}
.seg{display:flex; gap:2px; padding:3px; background:#232323; border-radius:999px}
.seg button{font:inherit; font-size:12px; letter-spacing:0; text-transform:none; font-weight:600; color:#bdb9b0; background:transparent; border:0; padding:6px 13px; border-radius:999px; cursor:pointer; transition:background .25s,color .25s}
.seg button[aria-pressed="true"]{background:#F3EEE6; color:#121212}
.recent{position:absolute; left:46px; right:46px; top:486px; z-index:25; color:#e9e6df}
.recent h4{margin:0 0 4px; font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:#8d8a84}
.row{display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-top:1px solid rgba(255,255,255,.08); font-size:13px; font-weight:500}
.row small{display:block; font-size:11px; color:#8d8a84; font-weight:400; margin-top:1px}
.row b{font-weight:600; font-variant-numeric:tabular-nums}
.row.new{animation:rowin .55s cubic-bezier(.2,1,.3,1) both}
@keyframes rowin{from{opacity:0; transform:translateY(-12px)} to{opacity:1; transform:none}}

/* The card: real aspect ratio, two faces, roughly the real corner radius, three finishes */
.card{position:absolute; left:34px; right:34px; aspect-ratio:1.586; border-radius:4.6% / 7.3%; padding:0; border:0; background:none; cursor:pointer; font:inherit;
  transform-style:preserve-3d; will-change:transform; -webkit-tap-highlight-color:transparent;
  box-shadow:0 10px 22px -10px rgba(0,0,0,.5), 0 2px 4px rgba(0,0,0,.2)}
.card.out{touch-action:none; cursor:grab}
.card:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
.face{position:absolute; inset:0; border-radius:inherit; backface-visibility:hidden; -webkit-backface-visibility:hidden; transform-style:preserve-3d; color:var(--fg);
  background:var(--bg); box-shadow:inset 0 0 0 1px rgba(255,255,255,.18), inset 0 1px 0 rgba(255,255,255,.35)}
.face::before,.face::after{content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:0; transition:opacity .55s}
.face::after{background:radial-gradient(120% 90% at 100% 0%, rgba(255,255,255,.28), rgba(255,255,255,0) 55%), linear-gradient(135deg, rgba(255,255,255,.18), rgba(255,255,255,0) 42%, rgba(0,0,0,.16)); opacity:1}
.face::before{background:repeating-linear-gradient(90deg, rgba(255,255,255,.11) 0 1px, rgba(0,0,0,.07) 1px 3px), linear-gradient(135deg, rgba(60,64,72,.55), rgba(200,206,215,.28) 50%, rgba(40,44,52,.6)); opacity:0}
.stage[data-fin="matte"] .face::after{opacity:.22}
.stage[data-fin="metal"] .face::before{opacity:1}
.stage[data-fin="metal"] .face::after{opacity:.65}
.face.bk{transform:rotateY(180deg)}
.sheen{position:absolute; inset:0; border-radius:inherit; pointer-events:none; mix-blend-mode:soft-light; opacity:.9; z-index:1; transition:opacity .55s;
  background:linear-gradient(110deg, rgba(255,255,255,0) 30%, rgba(255,255,255,.75) 46%, rgba(255,255,255,0) 62%); background-size:260% 100%; background-position:var(--sx,0%) 0}
.stage[data-fin="matte"] .sheen{opacity:.06}
.stage[data-fin="metal"] .sheen{opacity:1; mix-blend-mode:overlay}
.fr{position:absolute; inset:0; padding:5.5% 6%; display:flex; flex-direction:column; transform-style:preserve-3d; z-index:2}
.brand{transform:translateZ(10px)} .chiprow{transform:translateZ(16px)} .num{transform:translateZ(12px)} .row3{transform:translateZ(8px)}
.row1{display:flex; align-items:center; justify-content:space-between; font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase}
.brand{display:flex; align-items:center; gap:7px; font-family:var(--display); font-weight:700; font-size:15px; letter-spacing:-.01em; text-transform:none}
.chiprow{display:flex; align-items:center; gap:12px; margin-top:7%}
.chiprow svg.cl{opacity:.85}
.emb{text-shadow:0 1px 0 rgba(255,255,255,.35), 0 -1px 0 rgba(0,0,0,.28)}
.stage[data-fin="matte"] .emb{text-shadow:none}
.num{margin-top:auto; font-variant-numeric:tabular-nums; letter-spacing:.1em; font-size:clamp(14px,5.6vw,20px); font-weight:500; white-space:nowrap}
.row3{display:flex; align-items:flex-end; justify-content:space-between; margin-top:3.5%}
.lab{font-size:7px; letter-spacing:.12em; text-transform:uppercase; opacity:.8; font-weight:600; line-height:1.2}
.val{font-size:12px; letter-spacing:.08em; font-weight:600; text-transform:uppercase}
.type{font-family:var(--display); font-style:italic; font-weight:700; font-size:15px; letter-spacing:.02em; text-align:right; line-height:1}
.mag{position:absolute; left:0; right:0; top:11%; height:17%; background:#141414; z-index:2}
.sig{position:absolute; left:6%; right:6%; top:38%; height:16%; display:flex; align-items:center; justify-content:space-between; gap:8px; z-index:2}
.sig .pad{flex:1; height:100%; background:repeating-linear-gradient(135deg,#fff 0 5px,#f1f1f1 5px 10px); border-radius:3px; padding:0 8px; display:flex; align-items:center; font-size:9px; color:#555; letter-spacing:.06em; text-transform:uppercase}
.sig .cvv{width:23%; height:100%; background:#fff; border-radius:3px; display:flex; align-items:center; justify-content:center; font-family:ui-monospace,Menlo,monospace; font-size:13px; color:#222}
.small{position:absolute; left:6%; right:6%; bottom:8%; font-size:8.5px; line-height:1.45; opacity:.85; letter-spacing:.02em; z-index:2}
@keyframes drop{from{opacity:0; transform:translateY(46px)} to{opacity:1; transform:none}}
@keyframes fade{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
.back-w,.front-w{animation:drop .8s cubic-bezier(.2,.9,.3,1) both}
.top,.bal,.fin,.recent{animation:fade .7s .3s cubic-bezier(.2,.9,.3,1) both}
.rip{position:absolute; width:64px; height:64px; margin:-32px 0 0 -32px; border-radius:50%; border:2px solid rgba(18,18,18,.4); pointer-events:none; z-index:15; animation:rip 1.1s cubic-bezier(.15,.7,.3,1) both}
@keyframes rip{from{transform:scale(.3); opacity:.9} to{transform:scale(3.2); opacity:0}}
.toast{position:absolute; left:50%; top:16px; z-index:40; transform:translate(-50%,-70px); background:var(--ink); color:#fff; padding:10px 16px 10px 12px; border-radius:999px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; white-space:nowrap; transition:transform .5s cubic-bezier(.2,1.2,.3,1)}
.toast.on{transform:translate(-50%,0)}
.toast i{width:20px; height:20px; border-radius:50%; background:#14A883; display:grid; place-items:center; font-style:normal; font-size:12px}
@media (prefers-reduced-motion:reduce){ .back-w,.front-w,.top,.bal,.fin,.recent,.rip,.row.new{animation:none} .toast{transition:none} }
.foot{font-size:12px; color:var(--muted); text-align:center; max-width:380px; margin:0}
</style>

<main>
<div class="stage" id="stage" data-fin="glossy" aria-label="Morrow wallet with four cards">
  <div class="top">
    <div class="logo"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="14" fill="#121212"/><path d="M6 17a8 8 0 0 1 16 0" fill="none" stroke="#F3EEE6" stroke-width="3.2" stroke-linecap="round"/><circle cx="14" cy="9.2" r="2.4" fill="#FF6B4A"/></svg>morrow</div>
    <div class="hint" id="hint">Tap a card</div>
  </div>
  <div class="bal"><small id="bl">Total balance</small><strong id="bv">$12,480.00</strong></div>
  <div class="actions" id="actions"><button type="button" class="pill fill" id="pay">Tap to pay $4.50</button><button type="button" class="pill" id="flip">Flip card</button></div>
  <div class="toast" id="toast" role="status" aria-live="polite"><i>✓</i><span id="tmsg"></span></div>
  <div class="back-w"></div>
  <div class="front-w"></div>
  <div class="fin" id="fin"><span>Finish</span><div class="seg" role="group" aria-label="Card finish"><button type="button" data-f="matte" aria-pressed="false">Matte</button><button type="button" data-f="glossy" aria-pressed="true">Glossy</button><button type="button" data-f="metal" aria-pressed="false">Metal</button></div></div>
  <div class="recent" id="recent"><h4>Recent activity</h4><div id="rows"></div></div>
</div>
</main>

<script>
(function(){
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var stage = document.getElementById("stage");
  var $ = function(id){ return document.getElementById(id); };
  var POCKET = 400;
  var DATA = [
    {bg:"var(--c1)", fg:"#fff",    dark:false, last:"4821", bal:5240.50, peek:150, exp:"09/29"},
    {bg:"var(--c2)", fg:"#fff",    dark:false, last:"7710", bal:3180.00, peek:112, exp:"03/28"},
    {bg:"var(--c3)", fg:"#fff",    dark:false, last:"3095", bal:3600.25, peek:74,  exp:"11/29"},
    {bg:"var(--c4)", fg:"#2a2000", dark:true,  last:"1266", bal:459.25,  peek:36,  exp:"06/30"}
  ];
  var PAYS = [{m:"Corner Cup", a:4.50},{m:"Sunrise Bakery", a:7.25},{m:"Paper & Pine", a:12.80},{m:"Corner Cup", a:4.50}], payIdx = 0;
  var RECENT = [{m:"Bluebird Books", sub:"Yesterday", a:18.00},{m:"Green Thumb Flowers", sub:"Yesterday", a:22.40},{m:"Night Owl Laundromat", sub:"Mon", a:6.75}];
  function total(){ return DATA.reduce(function(a,c){return a+c.bal;},0); }
  var cards = [], sel = -1, flipped = false, paying = false, ptr = {x:0,y:0,on:false,t:0}, drag = null, suppress = false, sweep = -1;
  function money(n){ return "$" + n.toLocaleString("en-US",{minimumFractionDigits:2, maximumFractionDigits:2}); }
  function cardLabel(d){ return "Card ending " + d.last; }
  function label(d){ return "Debit card ending " + d.last + ", balance " + money(d.bal) + ". Press to take it out of the wallet."; }

  var MARK = '<svg width="20" height="20" viewBox="0 0 28 28" aria-hidden="true"><path d="M6 17a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/><circle cx="14" cy="9.2" r="2.5" fill="currentColor"/></svg>';
  var CHIP = '<svg width="44" height="34" viewBox="0 0 44 34" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4E3A6"/><stop offset=".5" stop-color="#D2B65F"/><stop offset="1" stop-color="#F0DA94"/></linearGradient></defs><rect x=".5" y=".5" width="43" height="33" rx="6" fill="url(#g)" stroke="rgba(0,0,0,.25)"/><g fill="none" stroke="rgba(90,65,10,.55)" stroke-width="1"><path d="M0 12h14v10H0M30 12h14M30 22h14M14 0v34M30 0v34M14 17h16"/><rect x="14" y="10" width="16" height="14" rx="3"/></g></svg>';
  var WAVES = '<svg class="cl" width="22" height="26" viewBox="0 0 22 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 5c3 5 3 11 0 16"/><path d="M10 2c5 7 5 15 0 22"/><path d="M16 0c7 8 7 18 0 26"/></svg>';

  DATA.forEach(function(d,k){
    var b = document.createElement("button"); b.type = "button"; b.className = "card"; b.dataset.k = k;
    b.style.zIndex = 1 + k; b.style.setProperty("--bg", d.bg); b.style.setProperty("--fg", d.fg); b.style.setProperty("--sx","100%");
    b.setAttribute("aria-pressed","false"); b.setAttribute("aria-label", label(d));
    var cls = d.dark ? "dark" : "";
    b.innerHTML =
      '<div class="face ' + cls + '"><div class="sheen"></div><div class="fr">' +
        '<div class="row1"><div class="brand">' + MARK + 'morrow</div></div>' +
        '<div class="chiprow">' + CHIP + WAVES + '</div>' +
        '<div class="num emb">1234 5678 9012 ' + d.last + '</div>' +
        '<div class="row3"><div><div class="lab">Valid thru</div><div class="val emb">' + d.exp + '</div><div class="val emb" style="margin-top:3px">Jordan Lee</div></div><div class="type emb">debit</div></div>' +
      '</div></div>' +
      '<div class="face bk ' + cls + '"><div class="sheen"></div><div class="mag"></div><div class="sig"><div class="pad">Authorized signature</div><div class="cvv">000</div></div>' +
        '<div class="small">Sample card for a concept project. Not a real card, bank or account. Sample numbers only.</div></div>';
    stage.insertBefore(b, stage.querySelector(".back-w").nextSibling);
    var s = {el:b, k:k, y:reduce?0:280, r:0, rx:0, ry:0, fl:0, sc:1, vy:0, vr:0, vrx:0, vry:0, vf:0, vs:0,
             ty:0, tr:0, trx:0, try:0, tf:0, ts:1, press:false, top:POCKET - d.peek, t0: performance.now() + (reduce?0:500 + k*140)};
    b.style.top = s.top + "px";
    cards.push(s);

    /* Press, drag up to pay, or tap. A drag past 60px releases into a payment. */
    b.addEventListener("pointerdown", function(e){
      s.press = true; kick();
      if (k === sel && !paying && !flipped){ drag = {s:s, y0:e.clientY, dy:0, moved:false}; try{ b.setPointerCapture(e.pointerId); }catch(_){} }
    });
    b.addEventListener("pointermove", function(e){
      if (!drag || drag.s !== s) return;
      var dy = e.clientY - drag.y0; if (Math.abs(dy) > 6) drag.moved = true;
      drag.dy = Math.max(-80, Math.min(24, dy));
      if (drag.moved){ $("actions").classList.remove("on"); $("hint").textContent = drag.dy < -60 ? "Release to pay" : "Drag up to pay"; }
      kick();
    });
    b.addEventListener("pointerup", function(){
      s.press = false;
      if (drag && drag.s === s){
        var d0 = drag; drag = null;
        if (d0.moved){ suppress = true; setTimeout(function(){ suppress = false; }, 80); if (d0.dy < -60) doPay(); else { $("hint").textContent = "Drag up to pay"; $("actions").classList.add("on"); } }
      }
      kick();
    });
    b.addEventListener("pointercancel", function(){ drag = null; s.press = false; if (sel !== -1 && !paying) $("actions").classList.add("on"); kick(); });
    b.addEventListener("click", function(e){ e.stopPropagation(); if (suppress || paying) return; choose(k === sel ? -1 : k); });
  });

  function H(){ return cards[0].el.offsetHeight || 197; }
  function targets(){
    var topOut = POCKET - 16 - H();
    cards.forEach(function(s){
      if (sel === -1){ s.ty = 0; s.tr = 0; s.ts = 1; s.tf = 0; }
      else if (s.k === sel){ s.ty = topOut - s.top; s.tr = flipped ? 0 : (s.k % 2 ? 1.4 : -1.4); s.ts = 1.03; s.tf = flipped ? 180 : 0; }
      else { s.ty = 16; s.tr = 0; s.ts = 0.985; s.tf = 0; }
    });
  }
  window.addEventListener("resize", function(){ targets(); kick(); });

  function payBtn(){ var p = PAYS[payIdx]; $("pay").textContent = "Tap to pay " + money(p.a); $("pay").disabled = sel !== -1 && DATA[sel].bal < p.a; }
  function choose(k){
    sel = k; flipped = false; targets();
    cards.forEach(function(s){ s.el.setAttribute("aria-pressed", s.k === sel ? "true" : "false"); s.el.style.zIndex = (s.k === sel) ? 8 : (1 + s.k); s.el.classList.toggle("out", s.k === sel); });
    $("hint").textContent = sel === -1 ? "Tap a card" : "Drag up to pay";
    $("actions").classList.toggle("on", sel !== -1);
    $("flip").textContent = "Flip card"; payBtn();
    countTo(sel === -1 ? total() : DATA[sel].bal, sel === -1 ? "Total balance" : cardLabel(DATA[sel]) + " balance");
    kick();
  }
  $("flip").addEventListener("click", function(e){
    e.stopPropagation(); if (sel === -1 || paying) return; flipped = !flipped; targets(); kick();
    this.textContent = flipped ? "Show front" : "Flip card";
  });
  stage.addEventListener("click", function(){ if (sel !== -1 && !paying) choose(-1); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && sel !== -1 && !paying) choose(-1); });

  /* Finish: matte, glossy or metal. A sweep of light crosses every card when it changes. */
  document.querySelectorAll(".seg button").forEach(function(btn){
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      stage.dataset.fin = btn.dataset.f;
      document.querySelectorAll(".seg button").forEach(function(x){ x.setAttribute("aria-pressed", x === btn ? "true" : "false"); });
      if (!reduce){ sweep = performance.now(); kick(); }
    });
  });
  $("fin").addEventListener("click", function(e){ e.stopPropagation(); });
  $("recent").addEventListener("click", function(e){ e.stopPropagation(); });

  /* Recent activity */
  function renderRows(fresh){
    var host = $("rows"); host.textContent = "";
    RECENT.slice(0,3).forEach(function(r,i){
      var d = document.createElement("div"); d.className = "row" + (fresh && i === 0 ? " new" : "");
      d.innerHTML = '<div>' + r.m + '<small>' + r.sub + '</small></div><b>−' + money(r.a) + '</b>';
      host.appendChild(d);
    });
  }
  renderRows(false);

  /* 3D tilt: the card that is out leans toward the pointer. At rest it drifts gently. */
  stage.addEventListener("pointermove", function(e){
    if (sel === -1 || reduce || drag) return;
    var r = stage.getBoundingClientRect();
    ptr.x = ((e.clientX - r.left)/r.width - .5)*2; ptr.y = ((e.clientY - r.top)/r.height - .5)*2; ptr.on = true; ptr.t = performance.now(); kick();
  });
  stage.addEventListener("pointerleave", function(){ ptr.on = false; });

  /* Tap to pay: lean toward the reader, ripples from the chip, balance drops, receipt toast, new row in recent activity. */
  function doPay(){
    var p = PAYS[payIdx];
    if (sel === -1 || paying || DATA[sel].bal < p.a) return;
    paying = true; var s = cards[sel], d = DATA[sel], topOut = POCKET - 16 - H();
    flipped = false; $("flip").textContent = "Flip card"; $("pay").disabled = true; $("hint").textContent = "Hold near the reader…";
    $("actions").classList.remove("on");
    s.ty = topOut - s.top - 4; s.trx = -18; s.tr = 0; s.tf = 0; kick();
    var chip = s.el.querySelector("svg.cl").getBoundingClientRect(), sr = stage.getBoundingClientRect();
    function ring(delay){ setTimeout(function(){ var el = document.createElement("div"); el.className = "rip";
      el.style.left = (chip.left - sr.left + chip.width/2) + "px"; el.style.top = (chip.top - sr.top + chip.height/2 - 8) + "px"; stage.appendChild(el); setTimeout(function(){ el.remove(); }, 1200); }, delay); }
    ring(450); ring(700); ring(950);
    setTimeout(function(){
      d.bal = Math.round((d.bal - p.a)*100)/100; s.el.setAttribute("aria-label", label(d));
      countTo(d.bal, cardLabel(d) + " balance");
      RECENT.forEach(function(r){ if (r.sub === "Just now") r.sub = "Today"; });
      RECENT.unshift({m:p.m, sub:"Just now", a:p.a}); RECENT.length = Math.min(RECENT.length, 6); renderRows(true);
      $("tmsg").textContent = "Paid " + money(p.a) + " · " + p.m; $("toast").classList.add("on");
      payIdx = (payIdx + 1) % PAYS.length;
    }, 1250);
    setTimeout(function(){ s.trx = 0; targets(); kick(); $("hint").textContent = "Drag up to pay"; }, 1900);
    setTimeout(function(){ $("toast").classList.remove("on"); paying = false; if (sel !== -1){ $("actions").classList.add("on"); payBtn(); } }, 3300);
  }
  $("pay").addEventListener("click", function(e){ e.stopPropagation(); doPay(); });

  var raf = 0, last = 0;
  function kick(){ if (!raf){ last = performance.now(); raf = requestAnimationFrame(step); } }
  function sp(x, v, t, k, c, dt){ var a = -k*(x-t) - c*v; v += a*dt; x += v*dt; return [x,v]; }
  function step(now){
    var dt = Math.min(.032, (now-last)/1000); last = now; var moving = false;
    if (ptr.on && now - ptr.t > 1800) ptr.on = false;
    var sw = -1; if (sweep >= 0){ sw = (now - sweep)/900; if (sw >= 1){ sweep = -1; sw = -1; } else moving = true; }
    cards.forEach(function(s){
      var out = (s.k === sel), live = out && !reduce, dragging = drag && drag.s === s;
      var ty = (now < s.t0) ? 280 : s.ty, tss = s.press ? s.ts*0.97 : s.ts;
      var trx = s.trx || 0, tr_y = s.try || 0;
      if (dragging){ ty += drag.dy; if (drag.moved) trx = drag.dy*0.14; }
      else if (live && !paying){
        if (ptr.on){ tr_y = ptr.x*14; trx = -ptr.y*10; }
        else { tr_y = Math.cos(now/1700)*4; trx = Math.sin(now/1300)*3; }
      }
      var bob = (live && !dragging) ? Math.sin(now/900)*2.2 : 0;
      if (reduce){ s.y = ty; s.r = s.tr; s.sc = tss; s.fl = s.tf; s.rx = s.ry = 0; }
      else {
        var a;
        a = sp(s.y,  s.vy,  ty,  out ? 190 : 150, out ? 17 : 20, dt); s.y = a[0]; s.vy = a[1];
        a = sp(s.r,  s.vr,  s.tr, 170, 18, dt); s.r = a[0]; s.vr = a[1];
        a = sp(s.sc, s.vs,  tss, 260, 22, dt); s.sc = a[0]; s.vs = a[1];
        a = sp(s.fl, s.vf,  s.tf, 120, 15, dt); s.fl = a[0]; s.vf = a[1];
        a = sp(s.rx, s.vrx, trx, 110, 13, dt); s.rx = a[0]; s.vrx = a[1];
        a = sp(s.ry, s.vry, tr_y, 110, 13, dt); s.ry = a[0]; s.vry = a[1];
      }
      s.el.style.transform = "perspective(900px) translateY(" + (s.y+bob).toFixed(2) + "px) rotate(" + s.r.toFixed(2) + "deg) rotateX(" + s.rx.toFixed(2) + "deg) rotateY(" + (s.fl+s.ry).toFixed(2) + "deg) scale(" + s.sc.toFixed(4) + ")";
      var sx = out ? (50 - s.ry*4) : 100;
      if (sw >= 0) sx = 110 - 130*sw;
      s.el.style.setProperty("--sx", sx.toFixed(1) + "%");
      if (live || dragging || Math.abs(s.y-ty) > .05 || Math.abs(s.vy) > .05 || Math.abs(s.r-s.tr) > .02 || Math.abs(s.sc-tss) > .0005 || Math.abs(s.fl-s.tf) > .1 || Math.abs(s.vf) > .1 || Math.abs(s.rx-trx) > .05 || Math.abs(s.ry-tr_y) > .05 || now < s.t0) moving = true;
    });
    raf = moving ? requestAnimationFrame(step) : 0;
  }

  var shown = 0, cd = 0;
  function countTo(v, lab){
    $("bl").textContent = lab;
    var from = shown, t0 = performance.now(), dur = reduce ? 1 : 560;
    cancelAnimationFrame(cd);
    (function tick(n){
      var p = Math.min(1, (n-t0)/dur), e = 1 - Math.pow(1-p, 3);
      shown = from + (v-from)*e; $("bv").textContent = money(shown);
      if (p < 1) cd = requestAnimationFrame(tick);
    })(t0);
  }
  setTimeout(function(){ countTo(total(), "Total balance"); }, reduce ? 0 : 300);
  targets(); kick(); payBtn();
  window.__wallet = {get sel(){return sel}, choose:choose, get paying(){return paying}};
})();
</script>
